# 可选示例：不复制时，Mod 会在首次加载自动生成配置并选择驱动。
# Optional example: the mod creates settings and selects a driver on first load.
# 启用 ASIO 输出。驱动面板的采样率和缓冲须与本配置一致。
# Enable ASIO output. Match the driver panel to 48000 Hz and BufferSamples.
Enabled = true
Driver = "Yamaha Steinberg USB ASIO"
# URX22C 实机验证使用 128；64 samples 曾欠载。驱动面板须同步设置。
# Tested URX22C setting: 128. Match the ASIO driver control panel.
# 可选 / Allowed: 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048
BufferSamples = 128
LeftChannel = 0
RightChannel = 1
# 仅排查问题时开启：每 5 秒写入统计文件并输出诊断日志。
# Troubleshooting only: write statistics and diagnostic logs every 5 seconds.
Diagnostics = false
