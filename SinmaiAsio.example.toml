# 可选示例：不复制时，Mod 会在首次加载自动生成配置并选择驱动。
# Optional example: the mod creates settings and selects a driver on first load.
# 启用 ASIO 输出，采样率固定为 48000 Hz。
# Enable ASIO output at 48000 Hz.
Enabled = true
Driver = "Yamaha Steinberg USB ASIO"
# 0：启动时自动使用驱动首选缓冲；正整数：手动指定。
# 0: follow the driver preferred size at startup; positive values: manual override.
# 可选 / Allowed: 0 (auto), 32, 48, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048
BufferSamples = 0
LeftChannel = 0
RightChannel = 1
# 仅排查问题时开启：每 5 秒写入统计文件并输出诊断日志。
# Troubleshooting only: write statistics and diagnostic logs every 5 seconds.
Diagnostics = false

# 诊断录音：保留最近 30 秒输出 PCM；收到保存请求才写入 WAV。
# Diagnostic capture: keep 30 seconds of output PCM; write WAV only on request.
CaptureOutput = false
